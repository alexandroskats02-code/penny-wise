services:
  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports: 
      - "5000:5000"
    environment:
     - ${MONGODB_URI:?MONGODB_URI must be set}

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
